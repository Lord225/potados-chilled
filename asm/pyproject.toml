[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "potados-asm"
version = "0.1.0"
description = "Assembler for the POTADOS Chilled 16-bit CPU"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
potados-asm = "potados_asm.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
