[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "potados-emulator"
version = "0.1.0"
description = "POTADOS Chilled cocotb/Verilator RTL simulator and debugger"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["potados-asm", "cocotb>=2.0.1"]

[project.scripts]
potados-emulator = "potados_emulator.cli:main"

[tool.uv.sources]
potados-asm = { path = "../../asm", editable = true }

[tool.hatch.build.targets.wheel.force-include]
"rtl/potados_sim_top.sv" = "potados_emulator/potados_sim_top.sv"
